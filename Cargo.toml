[package]
name = "eternal-snake-arena"
version = "0.1.0"
authors = ["kagesyntax"]
edition = "2021"

[dependencies]
dioxus = { version = "0.7.5", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rand = { version = "0.8", features = ["small_rng"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
