[package]
name = "eternal-snake-arena"
version = "0.1.0"
authors = ["kagesyntax"]
edition = "2021"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = { version = "0.7.5", default-features = false, features = ["launch", "macro", "html", "signals", "hooks", "asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rand = { version = "0.8", features = ["small_rng"] }
chrono = "0.4"
futures-timer = "3.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
